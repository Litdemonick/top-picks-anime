<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Must-Watch Anime — Abril 2026</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0e1a;
      --card-bg: #111827;
      --surface: #1a2236;
      --border: #1e2a4a;
      --border2: #2d3e6a;
      --text: #e2e8f0;
      --muted: #64748b;
      --accent: #7c3aed;
      --accent-light: #a78bfa;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
    }

    /* ── HERO ── */
    .hero {
      background: linear-gradient(180deg, #0d1225 0%, var(--bg) 100%);
      padding: 48px 24px 36px;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }

    .hero-badge {
      display: inline-block;
      background: rgba(124,58,237,0.15);
      border: 1px solid rgba(124,58,237,0.4);
      color: var(--accent-light);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 5px 16px;
      border-radius: 20px;
      margin-bottom: 16px;
    }

    .hero h1 {
      font-size: clamp(26px, 5vw, 42px);
      font-weight: 800;
      color: #f1f5f9;
      letter-spacing: -1px;
      margin-bottom: 10px;
    }

    .hero h1 span {
      background: linear-gradient(90deg, #818cf8, #c084fc, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero p {
      color: var(--muted);
      font-size: 14px;
    }

    /* ── FILTERS ── */
    .filters {
      display: flex;
      gap: 8px;
      padding: 24px 24px 8px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 1200px;
      margin: 0 auto;
    }

    .filter-btn {
      background: var(--surface);
      border: 1px solid var(--border2);
      color: #94a3b8;
      padding: 7px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.3px;
    }

    .filter-btn:hover { background: rgba(124,58,237,0.2); border-color: var(--accent); color: var(--accent-light); }
    .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    /* ── GRID ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 22px;
      padding: 22px 24px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* ── CARD ── */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      position: relative;
      transition: transform 0.3s cubic-bezier(.34,1.56,.64,1), border-color 0.2s, box-shadow 0.3s;
    }

    .card:hover {
      transform: translateY(-10px) scale(1.02);
      border-color: var(--accent);
      box-shadow: 0 24px 48px rgba(124,58,237,0.28);
    }

    .card-img-wrap { position: relative; overflow: hidden; }

    .card-img {
      width: 100%;
      height: 300px;
      object-fit: cover;
      display: block;
      background: var(--surface);
      transition: transform 0.4s ease;
    }

    .card:hover .card-img { transform: scale(1.06); }

    .card-img-wrap::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 120px;
      background: linear-gradient(transparent, var(--card-bg));
      pointer-events: none;
    }

    .rank-badge {
      position: absolute;
      top: 10px; left: 10px;
      font-size: 10px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 12px;
      letter-spacing: 0.5px;
      z-index: 2;
      text-transform: uppercase;
    }

    .rank-s { background: #dc2626; color: #fff; }
    .rank-a { background: #d97706; color: #fff; }
    .rank-b { background: #2563eb; color: #fff; }

    .platform-badge {
      position: absolute;
      top: 10px; right: 10px;
      font-size: 10px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 12px;
      z-index: 2;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .pl-cr { background: #f97316; color: #fff; }
    .pl-nf { background: #ef4444; color: #fff; }

    /* ── REAL TIME COUNTDOWN BADGE ── */
    .countdown-badge {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(17, 24, 39, 0.85);
      border: 1px solid var(--accent);
      color: #4ade80;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      z-index: 3;
      white-space: nowrap;
      backdrop-filter: blur(4px);
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      font-variant-numeric: tabular-nums;
    }

    .card-body { padding: 14px; position: relative; z-index: 2;}

    .card-genre {
      font-size: 11px;
      color: var(--accent-light);
      margin-bottom: 6px;
      font-weight: 600;
    }

    .card-title {
      font-size: 13px;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 8px;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 36px;
    }

    .card-meta {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .meta-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .meta-row svg {
      width: 12px; height: 12px;
      opacity: 0.5;
      flex-shrink: 0;
    }

    .card-desc {
      font-size: 11px;
      color: #4b5563;
      line-height: 1.55;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .score-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }

    .stars { color: #f59e0b; font-size: 12px; letter-spacing: 1px; }
    .score-num { font-size: 12px; font-weight: 700; color: #f59e0b; margin-left: auto; }

    .ep-live {
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #22c55e;
      margin-right: 2px;
      animation: pulse 1.5s infinite;
      vertical-align: middle;
      position: relative;
      top: -1px;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }

    /* ── MODAL ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      z-index: 999;
      align-items: center;
      justify-content: center;
      padding: 16px;
      backdrop-filter: blur(5px);
    }

    .modal-overlay.open { display: flex; }

    .modal {
      background: var(--card-bg);
      border: 1px solid var(--border2);
      border-radius: 20px;
      width: 100%;
      max-width: 560px;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
      animation: modalIn 0.3s cubic-bezier(.34,1.56,.64,1);
    }

    @keyframes modalIn {
      from { transform: scale(0.82); opacity: 0; }
      to   { transform: scale(1);    opacity: 1; }
    }

    .modal-img {
      width: 100%;
      height: 280px;
      object-fit: cover;
      border-radius: 20px 20px 0 0;
      background: var(--surface);
      display: block;
      background-position: center 20%;
    }

    .modal-close {
      position: absolute;
      top: 12px; right: 12px;
      width: 34px; height: 34px;
      border-radius: 50%;
      background: rgba(0,0,0,0.75);
      border: 1px solid var(--border2);
      color: #94a3b8;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, color 0.2s;
      z-index: 10;
    }

    .modal-close:hover { background: var(--accent); color: #fff; }

    .modal-body { padding: 22px; }

    .modal-title {
      font-size: 20px;
      font-weight: 800;
      color: #f1f5f9;
      margin-bottom: 4px;
      line-height: 1.3;
    }

    .modal-jp {
      font-size: 12px;
      color: var(--accent-light);
      margin-bottom: 18px;
      font-style: italic;
    }

    .modal-info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 18px;
    }

    .info-box {
      background: var(--surface);
      border-radius: 12px;
      padding: 11px 14px;
    }

    .info-box-label {
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 4px;
      font-weight: 600;
    }

    .info-box-val {
      font-size: 13px;
      color: var(--text);
      font-weight: 700;
    }

    .modal-desc {
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.65;
      margin-bottom: 20px;
    }

    .watch-btn {
      display: block;
      text-align: center;
      padding: 14px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      width: 100%;
      text-decoration: none;
      transition: opacity 0.2s, transform 0.1s;
      letter-spacing: 0.3px;
    }

    .watch-btn:hover { opacity: 0.85; transform: translateY(-1px); }
    .watch-btn:active { transform: scale(0.98); }
    .btn-cr { background: #f97316; color: #fff; }
    .btn-nf { background: #ef4444; color: #fff; }

    .no-results {
      text-align: center;
      padding: 80px 20px;
      color: #334155;
      font-size: 14px;
      grid-column: 1 / -1;
    }

    /* ── FOOTER ── */
    footer {
      text-align: center;
      padding: 32px 24px;
      color: #1e2a4a;
      font-size: 12px;
      border-top: 1px solid #0f1729;
      margin-top: 16px;
    }

    /* ── SCROLLBAR ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent); }
  </style>
</head>

    // 0: Domingo, 1: Lunes, 2: Martes, 3: Miércoles, 4: Jueves, 5: Viernes, 6: Sábado
    function getNextAirDate(dayOfWeek, hour, minute = 0) {
      const now = new Date();
      let nextDate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hour, minute, 0);
      const daysUntil = (dayOfWeek - now.getDay() + 7) % 7;
      
      // Si hoy es el día, pero la hora ya pasó, pasamos a la próxima semana
      if (daysUntil === 0 && now.getTime() > nextDate.getTime()) {
        nextDate.setDate(nextDate.getDate() + 7);
      } else {
        nextDate.setDate(nextDate.getDate() + daysUntil);
      }
      return nextDate.toISOString();
    }

      {
        id: 10,
        title: "Mata Korosarete Shimatta no desu ne, Tantei-sama",
        jp: "また殺されてしまったのですね、探偵様",
        genre: "Misterio / Sobrenatural",
        tags: ["fantasy", "netflix"],
        platform: "netflix",
        rank: "A",
        eps: "Emisión semanal",
        date: "Sábados",
        day: "Netflix",
        studio: "Por confirmar",
        score: 4,
        desc: "Un excéntrico detective tiene un don especial: si es asesinado durante una investigación, retrocede en el tiempo con los recuerdos de su propia muerte para desenmascarar a su asesino. Misterios estilo 'whodunit' con viajes temporales.",
        img: "https://image.pollinations.ai/prompt/anime%20poster%20detective%20murder%20mystery%20time%20loop%20anime?width=400&height=600&nologo=true",
        link: "https://www.netflix.com",
        nextEpisode: getNextAirDate(6, 10, 0) // Sábado a las 10:00
      }
    ];

    let currentAnime = null;

    function renderGrid(filterTag) {
      const grid = document.getElementById('grid');
      const list = filterTag === 'all' ? animes : animes.filter(a => a.tags.includes(filterTag));

      if (!list.length) {
        grid.innerHTML = '<div class="no-results">No hay animes con ese filtro por ahora.</div>';
        return;
      }

      grid.innerHTML = list.map(a => `
        <div class="card" onclick="openModal(${a.id})" tabindex="0" role="button">
          <div class="card-img-wrap">
            <img class="card-img" src="${a.img}" alt="${a.title}" loading="lazy">
            <span class="rank-badge rank-${a.rank.toLowerCase()}">${a.rank} Tier</span>
            <span class="platform-badge pl-${a.platform}">${a.platform === 'crunchyroll' ? 'CR' : 'NF'}</span>
            <div class="countdown-badge" data-target="${a.nextEpisode}">Calculando...</div>
          </div>
          <div class="card-body">
            <div class="card-genre">${a.genre}</div>
            <div class="card-title">${a.title}</div>
            <div class="card-meta">
              <div class="meta-row">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                ${a.date}
              </div>
              <div class="meta-row">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                <span class="ep-live"></span>${a.eps}
              </div>
            </div>
            <div class="card-desc">${a.desc}</div>
            <div class="score-wrap">
              <span class="stars">${'★'.repeat(a.score)}${'☆'.repeat(5 - a.score)}</span>
              <span class="score-num">${a.score}.0 / 5</span>
            </div>
          </div>
        </div>
      `).join('');
    }

    function filter(tag, btn) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderGrid(tag);
      updateCountdowns(); // Actualizar inmediatamente al filtrar
    }

    function openModal(id) {
      currentAnime = animes.find(a => a.id === id);
      if (!currentAnime) return;
      const a = currentAnime;
      document.getElementById('m-img').src = a.img;
      document.getElementById('m-title').textContent = a.title;
      document.getElementById('m-jp').textContent = a.jp;
      document.getElementById('m-date').textContent = a.date;
      document.getElementById('m-day').textContent = a.platform === 'crunchyroll' ? 'Crunchyroll' : 'Netflix';
      document.getElementById('m-eps').textContent = a.eps;
      document.getElementById('m-studio').textContent = a.studio;
      document.getElementById('m-desc').textContent = a.desc;
      
      const btn = document.getElementById('m-btn');
      btn.textContent = a.platform === 'crunchyroll' ? '▶ Ver en Crunchyroll' : '▶ Ver en Netflix';
      btn.className = 'watch-btn ' + (a.platform === 'crunchyroll' ? 'btn-cr' : 'btn-nf');
      btn.href = a.link;
      
      document.getElementById('modal').classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('open');
      document.body.style.overflow = '';
    }

    function closeModalOutside(e) {
      if (e.target === document.getElementById('modal')) closeModal();
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeModal();
    });

    // ── LÓGICA DE CONTADOR EN TIEMPO REAL ──
    function updateCountdowns() {
      const badges = document.querySelectorAll('.countdown-badge');
      const now = new Date().getTime();

      badges.forEach(badge => {
        const targetDate = badge.getAttribute('data-target');
        if (!targetDate) return;

        const distance = new Date(targetDate).getTime() - now;

        // Si el tiempo es menor a 0 (está saliendo justo ahora, dura 30 minutos)
        if (distance < 0 && distance > -1800000) {
          badge.textContent = "¡Ep. en emisión!";
          badge.style.color = "#f472b6";
          badge.style.borderColor = "#f472b6";
        } 
        // Si ya pasó, la función `getNextAirDate` calculará la de la próxima semana automáticamente al recargar
        else {
          badge.style.color = "#4ade80";
          badge.style.borderColor = "var(--accent)";
          
          const days = Math.floor(distance / (1000 * 60 * 60 * 24));
          const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
          const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
          const seconds = Math.floor((distance % (1000 * 60)) / 1000);

          badge.textContent = `Ep en: ${days}d ${hours}h ${minutes}m ${seconds}s`;
        }
      });
    }

    // Iniciar
    renderGrid('all');
    updateCountdowns();
    setInterval(updateCountdowns, 1000);
  </script>
</body>
</html>
